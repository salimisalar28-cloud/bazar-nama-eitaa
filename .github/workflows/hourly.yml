
name: Eitaa Hourly Market Report

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Publish report to Eitaa
        env:
          SERVIX_API_KEY: ${{ secrets.SERVIX_API_KEY }}
          EITAAYAR_TOKEN: ${{ secrets.EITAAYAR_TOKEN }}
          EITAAYAR_CHAT_ID: ${{ secrets.EITAAYAR_CHAT_ID }}
        run: python bot.py
